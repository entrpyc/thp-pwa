# Development Postgres. `pgvector/pgvector:pg17` ships PostgreSQL 17 with the `vector` extension
# installed as a package. Migration 0028_embeddings enables it per database (`CREATE EXTENSION IF
# NOT EXISTS vector`), so nothing here needs to; the image only has to carry the package.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: thp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thp
      POSTGRES_PASSWORD: thp
      POSTGRES_DB: thp
    # Loopback only: the credentials are fixed and public, so the port must not be — on a laptop
    # on café wifi, `5432:5432` is a superuser Postgres for everyone on the network.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - thp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thp -d thp']
      interval: 5s
      timeout: 5s
      retries: 20

  # Development object storage. MinIO speaks plain S3, which is what the media store's adapter
  # speaks — production is Cloudflare R2, and nothing in the source knows that.
  #
  # It is here so the properties that matter about a bucket are driven for real rather than faked:
  # a presigned PUT that is bound to a content type and expires, a CORS preflight that is what
  # makes a browser PUT possible at all, and an object that is **not readable without a signature**.
  # None of those is assertable against a stub.
  #
  # `MINIO_API_CORS_ALLOW_ORIGIN` is the bucket's CORS rule for development. A deployment sets the
  # equivalent rule on the real bucket by hand — see README.md, "Media store".
  minio:
    # Chainguard's build of MinIO (RELEASE.2026-10-23), pinned by digest because the free tier
    # publishes only a moving `latest`. `minio/minio` is gone: MinIO archived the community edition
    # in April 2026 and its Docker Hub and Quay images stopped pulling anonymously in September
    # 2026. Same binary, same flags, same env, and it ships `mc` for the healthcheck. The CI
    # workflow runs the same digest — change both together (ci.yml says how).
    image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    # The image defaults to a non-root user, which cannot open a `thp-minio-data` volume that the
    # old `minio/minio` image (which ran as root) already wrote — MinIO exits with "write
    # permissions for the backend". Root keeps every existing developer volume working without a
    # `docker volume rm`; this is a development container, and the old image ran as root anyway.
    user: '0:0'
    container_name: thp-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: thp
      MINIO_ROOT_PASSWORD: thp-secret-not-a-real-key
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    # Loopback only, as for Postgres: a fixed root password behind a port open to the network is
    # a public bucket. The app reaches it as 127.0.0.1:9000 (README.md "Media store") already.
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - thp-minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Create the development bucket, once, and exit.
  #
  # Without this, `docker compose up -d` followed by `npm run dev` gives a store with no bucket in
  # it, and the first upload fails with the screen's generic "the upload failed" — because a browser
  # is not told why a cross-origin PUT was refused, so the screen genuinely cannot say `NoSuchBucket`.
  # The bucket is named from `.env` so this and the application cannot disagree about which one it is.
  #
  # It only ever creates. `mc rb` appears nowhere in this repository, here included.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: thp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 thp thp-secret-not-a-real-key &&
        mc mb --ignore-existing "local/$${MEDIA_BUCKET}" &&
        echo "bucket $${MEDIA_BUCKET} ready"
    environment:
      MEDIA_BUCKET: ${MEDIA_BUCKET:?set MEDIA_BUCKET in .env — see .env.example}

volumes:
  thp-pgdata:
  thp-minio-data:
