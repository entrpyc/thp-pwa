name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: "commit messages start with feat:, fix: or chore:"
    # Pinned rather than `ubuntu-latest`: that label moved to Ubuntu 26 on 19 October 2026 and the
    # MinIO step, a `docker run`, started failing with exit 125 on every push from 21 October — the
    # image does not carry a working Docker yet. Nothing in this file needs the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Only the commits this push or pull request adds are checked, so history from before the
      # rule is left alone. The Deploy workflow reads these prefixes to write the release notes —
      # see scripts/check-commits.sh. A failure here fails CI, and the Deploy gate refuses a commit
      # CI has not passed on.
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from="$BASE"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            from="$BEFORE"
          else
            from="$HEAD_SHA~1"   # first push of a branch, or a force-push whose old tip is gone
          fi
          scripts/check-commits.sh "$from..$HEAD_SHA"

  verify:
    name: install, typecheck, migrate, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # PostgreSQL 17 with the `vector` extension installed as a package but NOT enabled — the exact
    # state docs/epics/epic-core-listening/stories/get-a-person-in/01-project-skeleton.md requires, and which the test suite asserts.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: thp
          POSTGRES_PASSWORD: thp
          POSTGRES_DB: thp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thp -d thp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://thp:thp@127.0.0.1:5432/thp
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # An S3-compatible object store, started as a step rather than as a service container: the
      # image needs a command (`server /data`) and a service container cannot give it one. The
      # suite drives presigning, the CORS preflight and the unsigned-read refusal against this for
      # real — none of the three is a property a fake could have. Production is Cloudflare R2, and
      # nothing in the source knows that.
      #
      # Chainguard's build of MinIO, not `minio/minio`: MinIO archived the community edition in
      # April 2026 and its Docker Hub and Quay images stopped pulling anonymously in September 2026
      # ("pull access denied", exit 125 on every push from 24 October). Chainguard publishes only a
      # moving `latest`, so the digest pins it; docker-compose.yml runs the same digest. To move it:
      # `docker pull cgr.dev/chainguard/minio:latest`, read the RepoDigest from
      # `docker image inspect`, and change both places together.
      - name: Object storage (MinIO)
        run: |
          docker run -d --name thp-minio -p 9000:9000 -e MINIO_ROOT_USER=thp -e MINIO_ROOT_PASSWORD=thp-secret-not-a-real-key -e MINIO_API_CORS_ALLOW_ORIGIN='*' cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7 server /data
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "MinIO never became ready"; docker logs thp-minio; exit 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exactly the documented sequence from a clean checkout — README.md, "Commands".
      - name: Install
        run: npm ci

      - name: Typecheck (whole workspace, one program)
        run: npm run typecheck

      # **Schema and migrations must agree.** `drizzle-kit generate` against a schema whose every
      # change already has SQL writes nothing; against one that has drifted it writes a new
      # migration, and that file appearing is the failure. v1.7.0 shipped a table, an enum value
      # and two indexes that existed in schema.ts alone, and production answered 500 on reports,
      # account deletion and every push (docs/security-audit-2026-10-29.md, finding 1). The
      # migration test below sees the drift only once somebody wrote a test for the new table; this
      # sees it for any table.
      - name: Schema and migrations agree (no drizzle-kit diff)
        run: |
          npm run db:generate -- --name ci-drift-check
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "::error::packages/db/src/schema.ts has changes with no migration. Run 'npm run db:generate -- --name <what-changed>' and commit the result."
            git status --porcelain -- packages/db/drizzle
            git diff -- packages/db/drizzle/meta/_journal.json
            exit 1
          fi

      - name: Migrate
        run: npm run migrate

      # The sign-in screen is checked in a real browser — layout overflow, keyboard order and
      # "no full page reload" are not answerable in a DOM simulation. Chromium only; nothing in
      # the suite is cross-browser.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `NEXT_PUBLIC_API_ORIGIN` is inlined at build time, so "the client calls the right origin" is
      # a property of the build output rather than of the environment — and the failure it catches
      # is silent: a build made before `.env` held the production origin serves a site that looks
      # correct and calls localhost from every visitor's browser. Nothing else notices.
      - name: The built client calls the origin it was built for
        run: npm run check:origin

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-server-logs
          path: .tmp/logs/
          if-no-files-found: ignore
