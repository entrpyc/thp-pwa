name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, typecheck, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL 17 with the `vector` extension installed as a package but NOT enabled — the exact
    # state docs/epics/epic-core-listening/stories/get-a-person-in/01-project-skeleton.md requires, and which the test suite asserts.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: thp
          POSTGRES_PASSWORD: thp
          POSTGRES_DB: thp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thp -d thp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://thp:thp@127.0.0.1:5432/thp
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      # An S3-compatible object store, started as a step rather than as a service container: the
      # `minio/minio` image needs a command (`server /data`) and a service container cannot give it
      # one. The suite drives presigning, the CORS preflight and the unsigned-read refusal against
      # this for real — none of the three is a property a fake could have. Production is Cloudflare
      # R2, and nothing in the source knows that.
      - name: Object storage (MinIO)
        run: |
          docker run -d --name thp-minio -p 9000:9000 -e MINIO_ROOT_USER=thp -e MINIO_ROOT_PASSWORD=thp-secret-not-a-real-key -e MINIO_API_CORS_ALLOW_ORIGIN='*' minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "MinIO never became ready"; docker logs thp-minio; exit 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exactly the documented sequence from a clean checkout — README.md, "Commands".
      - name: Install
        run: npm ci

      - name: Typecheck (whole workspace, one program)
        run: npm run typecheck

      - name: Migrate
        run: npm run migrate

      # The sign-in screen is checked in a real browser — layout overflow, keyboard order and
      # "no full page reload" are not answerable in a DOM simulation. Chromium only; nothing in
      # the suite is cross-browser.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `NEXT_PUBLIC_API_ORIGIN` is inlined at build time, so "the client calls the right origin" is
      # a property of the build output rather than of the environment — and the failure it catches
      # is silent: a build made before `.env` held the production origin serves a site that looks
      # correct and calls localhost from every visitor's browser. Nothing else notices.
      - name: The built client calls the origin it was built for
        run: npm run check:origin

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-server-logs
          path: .tmp/logs/
          if-no-files-found: ignore
