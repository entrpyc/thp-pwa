<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Teaching Hub</title>
    <!--
      The shell's offline screen. `server.errorPath` in capacitor.config.ts names this file, and
      Capacitor loads it in place of the WebView's own error page when `server.url` cannot be
      reached — no network, a captive portal, the server down. It is the one page in this
      directory a member can see, so it looks like the product rather than like a browser.

      Three constraints shape it:

      - It is a local file with no access to the site, so everything it needs is inline: no
        stylesheet, no font, no script from the origin. The colours are the token layer's `--color-bg`
        (`APP_BACKGROUND_COLOUR` in packages/web/src/app/app-theme.ts), surface, text and accent,
        spelled here because the token stylesheet is on the server this page exists to replace.
      - On Android the file has no Capacitor plugins (the documented limit of `errorPath`), so the
        retry is a plain navigation to the origin. The origin is the production one unless the
        shell was built against another (`THP_SHELL_SERVER_URL`), in which case `cap sync` is
        preceded by the build step in packages/shell/README.md that rewrites `data-origin` below.
      - It retries on its own when the device reports connectivity again (`online`), so a member
        who walks back into coverage sees the app rather than a button.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #01101f;
        --surface: #0f2438;
        --text: #f2f5f9;
        --muted: #8a97ac;
        --accent: #6d2ed9;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 24rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark svg {
        width: 30px;
        height: 30px;
        margin-left: 4px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.375rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }
      button {
        appearance: none;
        min-height: 48px;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.6;
      }
      .status {
        margin: 16px 0 0;
        min-height: 1.5rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body data-origin="https://thp.indepthwebsolutions.com">
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fafafa"><path d="M7 4.5v15l12-7.5z" /></svg>
      </div>
      <h1>You’re offline</h1>
      <p>
        Teaching Hub needs a connection to load. Teachings you downloaded are still on this phone and
        will play once the app reaches its server.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var origin = document.body.getAttribute('data-origin');
        var retry = document.getElementById('retry');
        var status = document.getElementById('status');
        var attempting = false;

        function attempt(reason) {
          if (attempting) return;
          attempting = true;
          retry.disabled = true;
          status.textContent = reason === 'online' ? 'Connection is back. Loading…' : 'Loading…';
          // A navigation, not a reload: reloading would reload this file. If the origin is still
          // unreachable the shell lands back here, which is the right place to be.
          window.location.replace(origin + '/');
        }

        retry.addEventListener('click', function () {
          attempt('press');
        });
        window.addEventListener('online', function () {
          attempt('online');
        });
        // Landing here while the device says it is online means the server, not the network, was
        // unreachable; say so, because "offline" would be the wrong thing to fix.
        if (typeof navigator.onLine === 'boolean' && navigator.onLine) {
          status.textContent = 'Your phone is connected, but the server could not be reached.';
        }
      })();
    </script>
  </body>
</html>
