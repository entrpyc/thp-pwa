# thp.indepthwebsolutions.com — the reverse proxy in front of the Next.js process.
#
# **This box already serves other sites.** This file is a new one under `sites-available`,
# symlinked into `sites-enabled`; no existing nginx file is edited by this deployment, and this
# block deliberately does not claim `default_server` — taking the default would change which site
# answers a request that matches no `server_name`, which is a way to take somebody else's site down
# from a file that never mentions it.
#
# **certbot manages the TLS lines.** The certificate for this host was issued before this file
# existed, so `certbot --nginx` has already written `ssl_certificate`, `ssl_certificate_key`, the
# `include` of its options file and the port-80 redirect into whatever block was there. Treat this
# file as the shape to diff the live one against, not as something to paste over it: the parts
# worth copying across are the proxy headers and the body size, and the parts certbot owns are
# marked below.
#
# Renewal is certbot's existing systemd timer. Nothing in this deployment adds a second one.

# Which requests the access log records. Password-reset, account-deletion and invitation links
# carry their one-time token in the query string, and nginx logs the whole request line — so
# until a member clicks, a live token sits in /var/log/nginx/access.log for as long as logrotate
# keeps it. These paths (the pages the links land on, and the API routes the pages call with the
# same token) are left out of the log altogether; everything else is logged as before. `$uri` is
# the decoded path without the query, so a token never reaches this map either.
map $uri $thp_loggable {
    default                                                1;
    ~^/(reset-password|delete-account|accept-invitation)$  0;
    ~^/api/v1/auth/(password-reset|account-deletion)$      0;
    ~^/api/v1/invitations/accept$                          0;
}

server {
    server_name thp.indepthwebsolutions.com;

    # See the map above. The path is nginx's default; it is named here because `if=` needs a full
    # directive rather than a modifier on the inherited one.
    access_log /var/log/nginx/access.log combined if=$thp_loggable;

    # The version in the `Server` header and on error pages is a free hint to anyone scanning.
    server_tokens off;

    # Two years, as the preload list requires, and the subdomains too: once a browser has seen this
    # over TLS it refuses plain HTTP to the host, so the port-80 redirect below is for the first
    # visit only and a downgrade on a hostile network has nothing to downgrade. `always` so error
    # answers carry it too. The application sets the remaining browser headers (CSP, nosniff,
    # Referrer-Policy) itself, because it knows which origins its pages reach and nginx does not.
    # `verify:production`'s `tls` check asserts this header is served.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Audio never passes through nginx — uploads go straight from the browser to the bucket on a
    # presigned PUT, and playback comes from the object store. This ceiling is here so that no
    # ordinary form post ever meets nginx's 1 MB default and fails with a 413 nobody expects.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The application builds absolute URLs and reads the caller's scheme from these. Without
        # `X-Forwarded-Proto` a TLS-terminating proxy makes every request look like plain HTTP to
        # the process behind it, and a secure-cookie decision made on that is made wrongly.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams responses; buffering them defeats that and delays the first byte.
        proxy_buffering off;

        # Long enough that a slow first render is not a 504, short enough that a hung upstream is
        # not held open forever. Nothing in this application legitimately takes a minute: anything
        # that could takes a job in the ledger instead.
        proxy_read_timeout 60s;
    }

    # Analytics, first-party. The browser sends PostHog events to this path on the app's own origin
    # and nginx forwards them to the EU host, so a content blocker that drops `eu.i.posthog.com`
    # by name drops nothing here. The path is named once in the client
    # (`packages/web/src/client/observability/config.ts`, ANALYTICS_PROXY_PATH) and a guard test holds
    # it equal to this block, so change both or neither. `verify:production`'s `analytics-proxy`
    # check posts through it and expects PostHog's answer.
    #
    # What is deliberately *not* forwarded: the app's session cookie, which the browser attaches to
    # every same-origin request and which PostHog has no business seeing; the Referer, which carries
    # the member's current URL and the ids in it; and the client's address, since nginx adds no
    # X-Forwarded-For here and the PostHog project discards IPs anyway. Buffering is left on — these
    # are small POSTs with a small JSON answer, and nothing streams.
    location /relay/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_http_version 1.1;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
        proxy_read_timeout 15s;
    }

    # ---- managed by certbot: listen 443 ssl, ssl_certificate, ssl_certificate_key, include ----
    listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/thp.indepthwebsolutions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/thp.indepthwebsolutions.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP redirects to HTTPS. certbot writes this block itself when it converts a site; it is
# reproduced here because `verify:production`'s `http-redirect` check asserts it, and a reader
# should be able to see what is being asserted.
server {
    listen 80;
    server_name thp.indepthwebsolutions.com;
    return 301 https://$host$request_uri;
}
