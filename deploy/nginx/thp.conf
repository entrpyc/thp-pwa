# thp.indepthwebsolutions.com — the reverse proxy in front of the Next.js process.
#
# **This box already serves other sites.** This file is a new one under `sites-available`,
# symlinked into `sites-enabled`; no existing nginx file is edited by this deployment, and this
# block deliberately does not claim `default_server` — taking the default would change which site
# answers a request that matches no `server_name`, which is a way to take somebody else's site down
# from a file that never mentions it.
#
# **certbot manages the TLS lines.** The certificate for this host was issued before this file
# existed, so `certbot --nginx` has already written `ssl_certificate`, `ssl_certificate_key`, the
# `include` of its options file and the port-80 redirect into whatever block was there. Treat this
# file as the shape to diff the live one against, not as something to paste over it: the parts
# worth copying across are the proxy headers and the body size, and the parts certbot owns are
# marked below.
#
# Renewal is certbot's existing systemd timer. Nothing in this deployment adds a second one.

server {
    server_name thp.indepthwebsolutions.com;

    # Audio never passes through nginx — uploads go straight from the browser to the bucket on a
    # presigned PUT, and playback comes from the object store. This ceiling is here so that no
    # ordinary form post ever meets nginx's 1 MB default and fails with a 413 nobody expects.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The application builds absolute URLs and reads the caller's scheme from these. Without
        # `X-Forwarded-Proto` a TLS-terminating proxy makes every request look like plain HTTP to
        # the process behind it, and a secure-cookie decision made on that is made wrongly.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams responses; buffering them defeats that and delays the first byte.
        proxy_buffering off;

        # Long enough that a slow first render is not a 504, short enough that a hung upstream is
        # not held open forever. Nothing in this application legitimately takes a minute: anything
        # that could takes a job in the ledger instead.
        proxy_read_timeout 60s;
    }

    # ---- managed by certbot: listen 443 ssl, ssl_certificate, ssl_certificate_key, include ----
    listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/thp.indepthwebsolutions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/thp.indepthwebsolutions.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP redirects to HTTPS. certbot writes this block itself when it converts a site; it is
# reproduced here because `verify:production`'s `http-redirect` check asserts it, and a reader
# should be able to see what is being asserted.
server {
    listen 80;
    server_name thp.indepthwebsolutions.com;
    return 301 https://$host$request_uri;
}
