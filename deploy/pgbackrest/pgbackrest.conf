# pgBackRest — a nightly full backup plus a continuous WAL archive, to Cloudflare R2.
#
# Goes to /etc/pgbackrest/pgbackrest.conf on the box, owned `root:postgres`, mode `0640` — it holds
# the repository secret, and the `postgres` user has to read it because the archive command runs as
# postgres.
#
# **The two credentials below are not the media bucket's, and that is a requirement rather than
# tidiness.** Retention deletes from this repository every night, by design. The media bucket is
# the one thing this product never deletes from — the original upload is what transcription reads
# and every later re-transcription depends on, and `@thp/media`'s port has no delete operation at
# all. One credential across both buckets would put a delete capability exactly where the epic's
# single non-negotiable says there is none. `verify:production`'s `backup-isolation` check reads
# this file and refuses if the bucket or the key matches `MEDIA_*` in `.env`.
#
# The cost this comes to: R2 is $0.015/GB-month and $4.50 per million Class A operations. This
# database is metadata, transcripts and segments — under 1 GB for years — so two retained fulls
# plus the WAL archive is 1–3 GB, and `archive-timeout` at 300s pushes at most ~8,700 segments a
# month. Roughly $0.10/month, against the $1 line in
# docs/project/architecture.md § Estimated running costs.

[global]
repo1-type=s3
# R2's S3 endpoint for the account. Path-style addressing: R2 does not do virtual-host buckets.
repo1-s3-endpoint=<account-id>.r2.cloudflarestorage.com
repo1-s3-uri-style=path
repo1-s3-region=auto
repo1-s3-bucket=thp-backups
repo1-s3-key=<the backups-bucket token id — NOT the media bucket's>
repo1-s3-key-secret=<the backups-bucket token secret>

# Two full backups retained. That is what buys the point-in-time window: everything from the older
# of the two forwards is recoverable, so roughly a fortnight at a nightly cadence. Raising it is a
# line here and a few cents a month.
repo1-retention-full=2

# The archive is already TLS in transit and the repository is not shared; encrypting it as well
# would add a passphrase that has to survive the loss of this box to be worth anything, and where
# that passphrase would live has not been decided. Left explicit rather than defaulted so that the
# decision is visible.
repo1-cipher-type=none

compress-type=zst
# Two of the four vCPU. The other two are the application, the worker and Postgres, and a backup
# that starves the site at 02:00 is a backup with a cost nobody agreed to.
process-max=2
start-fast=y
log-level-console=info
log-level-file=detail

[thp]
# Ubuntu's PGDG layout. `pg_lsclusters` prints the real path if this box differs.
pg1-path=/var/lib/postgresql/17/main
