<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-labelledby="t d">
  <title id="t">Teaching Hub — series artwork</title>
  <desc id="d">What this scope adds and where it attaches. The browser re-encodes a chosen image and sends it straight to the media store under a presigned PUT; the API re-reads the stored object and writes one nullable artwork_key on the existing series row. Every read surface gets a signed URL minted per response. Four existing surfaces fill a seam that already exists, and one new route — the now-playing view — is added inside the member layout so the docked transport stays mounted.</desc>

  <style>
    .n    { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub  { font: 400 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .grp  { font: 600 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6c6a65; letter-spacing: .02em; }
    .edge { font: 400 10.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a4844; }
    .note { font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #444441; }
    .ttl  { font: 700 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2b2a28; }
    .l    { fill: none; stroke: #7b7975; stroke-width: 1.6; }
    .ld   { fill: none; stroke: #7b7975; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .cl   { fill: #ffffff; fill-opacity: .55; stroke: #c3c1bb; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .box  { fill: #ffffff; stroke: #b9b7b1; stroke-width: 1.3; }
    .new  { fill: #ffffff; stroke: #2b2a28; stroke-width: 2; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b7975"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#fbfbf9" stroke="#e2e0da"/>
  <text class="ttl" x="32" y="28">Teaching Hub — series artwork</text>
  <text class="note" x="32" y="48">Heavy outline = added by this scope. Light outline = already there.</text>

  <!-- ── write path ───────────────────────────────────────────── -->
  <rect class="cl" x="32" y="70" width="856" height="196" rx="8"/>
  <text class="grp" x="44" y="90">SETTING A COVER — SCOPE PRD 3.1</text>

  <rect class="new" x="52" y="104" width="176" height="70" rx="8"/>
  <text class="n"   x="66" y="130">Series console row</text>
  <text class="sub" x="66" y="148">pick a file, re-encode</text>
  <text class="sub" x="66" y="163">≤2000px · WebP · &lt;2MB</text>

  <rect class="new" x="278" y="104" width="176" height="70" rx="8"/>
  <text class="n"   x="292" y="130">API — grant</text>
  <text class="sub" x="292" y="148">POST /series/{id}</text>
  <text class="sub" x="292" y="163">/artwork/uploads</text>

  <rect class="box" x="504" y="104" width="176" height="70" rx="8"/>
  <text class="n"   x="518" y="130">Media store</text>
  <text class="sub" x="518" y="148">artwork/&lt;uuid&gt;.webp</text>
  <text class="sub" x="518" y="163">no delete · not public</text>

  <rect class="new" x="278" y="196" width="176" height="56" rx="8"/>
  <text class="n"   x="292" y="220">API — finalise</text>
  <text class="sub" x="292" y="238">PUT /series/{id}/artwork</text>

  <rect class="box" x="504" y="196" width="176" height="56" rx="8"/>
  <text class="n"   x="518" y="220">Postgres — series</text>
  <text class="sub" x="518" y="238">+ artwork_key (nullable)</text>

  <path class="l" d="M228 132 H272" marker-end="url(#a)"/>
  <text class="edge" x="232" y="124">ask</text>
  <path class="l" d="M454 139 H498" marker-end="url(#a)"/>
  <text class="edge" x="458" y="131">presigned PUT</text>
  <path class="l" d="M140 174 V282 H540 V180" marker-end="url(#a)"/>
  <text class="edge" x="150" y="298">bytes go straight to the store — never through the API</text>
  <path class="l" d="M140 174 V196 H272" marker-end="url(#a)"/>
  <text class="edge" x="152" y="190">then finalise</text>
  <path class="l" d="M592 174 V196" marker-end="url(#a)"/>
  <text class="edge" x="600" y="190">head: re-check size &amp; type</text>
  <path class="l" d="M454 224 H498" marker-end="url(#a)"/>
  <text class="edge" x="440" y="264">write the pointer only if the re-check passes</text>

  <text class="note" x="712" y="130">Replace writes a new key.</text>
  <text class="note" x="712" y="148">The old object is orphaned</text>
  <text class="note" x="712" y="166">and stays — 3.1.5.</text>

  <!-- ── read path ────────────────────────────────────────────── -->
  <rect class="cl" x="32" y="326" width="856" height="256" rx="8"/>
  <text class="grp" x="44" y="346">SHOWING IT — SCOPE PRD 3.2, 3.3</text>

  <rect class="box" x="52" y="360" width="200" height="70" rx="8"/>
  <text class="n"   x="66" y="386">API — series / recording</text>
  <text class="sub" x="66" y="404">payload + artworkUrl</text>
  <text class="sub" x="66" y="419">signed GET, 1 hour</text>

  <path class="ld" d="M252 395 H300" marker-end="url(#a)"/>
  <text class="edge" x="256" y="387">a URL, never a key</text>

  <rect class="box" x="306" y="352" width="170" height="44" rx="8"/>
  <text class="n"   x="320" y="379">Series listing row</text>

  <rect class="box" x="306" y="406" width="170" height="44" rx="8"/>
  <text class="n"   x="320" y="433">Series page hero</text>

  <rect class="box" x="306" y="460" width="170" height="44" rx="8"/>
  <text class="n"   x="320" y="487">Recording page hero</text>

  <rect class="box" x="306" y="514" width="170" height="44" rx="8"/>
  <text class="n"   x="320" y="541">Docked transport tile</text>

  <text class="note" x="492" y="380">Four seams that already exist,</text>
  <text class="note" x="492" y="398">each named in the code as</text>
  <text class="note" x="492" y="416">artwork being deferred. This</text>
  <text class="note" x="492" y="434">scope fills them; the no-cover</text>
  <text class="note" x="492" y="452">rendering is unchanged — 3.2.6.</text>

  <rect class="new" x="678" y="490" width="200" height="76" rx="8"/>
  <text class="n"   x="692" y="516">Now-playing view</text>
  <text class="sub" x="692" y="534">route inside member layout</text>
  <text class="sub" x="692" y="549">square cover + scripture</text>

  <path class="l" d="M476 536 H672" marker-end="url(#a)"/>
  <text class="edge" x="500" y="528">opens · closes back</text>

  <text class="note" x="678" y="466">The layout keeps the transport</text>
  <text class="note" x="678" y="484">mounted, so audio never stops.</text>
</svg>
